<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MP3 + Foto → Vídeo</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, Roboto, Arial, sans-serif;
    background: #111;
    color: #eee;
    margin: 0;
    padding: 16px;
    max-width: 480px;
    margin: 0 auto;
  }
  h1 { font-size: 1.3em; text-align: center; margin-bottom: 4px; }
  p.sub { text-align: center; color: #999; font-size: 0.85em; margin-top: 0; }
  .box {
    background: #1c1c1c;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  label {
    display: block;
    font-size: 0.9em;
    margin-bottom: 6px;
    color: #ccc;
  }
  input[type="file"] {
    width: 100%;
    padding: 10px;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    color: #eee;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 14px;
    font-size: 1.05em;
    font-weight: 600;
    border: none;
    border-radius: 10px;
    background: #4f8cff;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #333; color: #777; }
  #status {
    text-align: center;
    font-size: 0.9em;
    color: #aaa;
    min-height: 20px;
    margin-top: 10px;
  }
  #preview {
    width: 100%;
    border-radius: 8px;
    margin-top: 10px;
    background: black;
  }
  canvas { display: none; }
  a.download {
    display: block;
    text-align: center;
    margin-top: 10px;
    padding: 12px;
    background: #2ecc71;
    color: #072;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
  }
  .bar {
    height: 6px;
    background: #333;
    border-radius: 3px;
    overflow: hidden;
    margin-top: 10px;
  }
  .bar > div {
    height: 100%;
    background: #4f8cff;
    width: 0%;
  }
</style>
</head>
<body>

<h1>🎵 MP3 + 📷 Foto → 🎬 Vídeo</h1>
<p class="sub">100% local, sin subir nada a ningún servidor</p>

<div class="box">
  <label>Foto (jpg/png)</label>
  <input type="file" id="imgInput" accept="image/*">

  <label>Audio (mp3)</label>
  <input type="file" id="audioInput" accept="audio/*">

  <button id="genBtn">Generar vídeo</button>
  <div class="bar"><div id="barFill"></div></div>
  <div id="status"></div>
</div>

<div class="box" id="resultBox" style="display:none">
  <video id="preview" controls></video>
  <a id="downloadLink" class="download" download="video.webm">⬇ Descargar vídeo (.webm)</a>
</div>

<canvas id="canvas" width="1280" height="720"></canvas>

<script>
const imgInput = document.getElementById('imgInput');
const audioInput = document.getElementById('audioInput');
const genBtn = document.getElementById('genBtn');
const statusEl = document.getElementById('status');
const barFill = document.getElementById('barFill');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const resultBox = document.getElementById('resultBox');
const preview = document.getElementById('preview');
const downloadLink = document.getElementById('downloadLink');

function setStatus(msg) { statusEl.textContent = msg; }

function drawImageContain(img) {
  const cw = canvas.width, ch = canvas.height;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, cw, ch);
  const ratio = Math.min(cw / img.width, ch / img.height);
  const w = img.width * ratio;
  const h = img.height * ratio;
  const x = (cw - w) / 2;
  const y = (ch - h) / 2;
  ctx.drawImage(img, x, y, w, h);
}

function pickMimeType() {
  const candidates = [
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];
  for (const c of candidates) {
    if (MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

genBtn.addEventListener('click', async () => {
  const imgFile = imgInput.files[0];
  const audioFile = audioInput.files[0];

  if (!imgFile || !audioFile) {
    setStatus('Por favor selecciona una foto y un mp3.');
    return;
  }

  genBtn.disabled = true;
  resultBox.style.display = 'none';
  barFill.style.width = '0%';
  setStatus('Cargando archivos...');

  try {
    // Load image
    const imgURL = URL.createObjectURL(imgFile);
    const img = new Image();
    await new Promise((res, rej) => {
      img.onload = res;
      img.onerror = rej;
      img.src = imgURL;
    });
    drawImageContain(img);

    // Set up audio graph
    const audioURL = URL.createObjectURL(audioFile);
    const audioEl = new Audio();
    audioEl.src = audioURL;
    audioEl.crossOrigin = 'anonymous';
    await new Promise((res, rej) => {
      audioEl.onloadedmetadata = res;
      audioEl.onerror = rej;
    });

    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioCtx();
    const source = audioCtx.createMediaElementSource(audioEl);
    const dest = audioCtx.createMediaStreamDestination();
    source.connect(dest);
    source.connect(audioCtx.destination); // para que se oiga durante la generación

    // Canvas + audio streams combined
    const canvasStream = canvas.captureStream(5); // 5 fps, imagen estática
    const combined = new MediaStream([
      ...canvasStream.getVideoTracks(),
      ...dest.stream.getAudioTracks()
    ]);

    const mimeType = pickMimeType();
    if (!mimeType) {
      setStatus('Este navegador no soporta grabación de vídeo WebM.');
      genBtn.disabled = false;
      return;
    }

    const recorder = new MediaRecorder(combined, { mimeType });
    const chunks = [];
    recorder.ondataavailable = (e) => { if (e.data.size > 0) chunks.push(e.data); };

    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: mimeType });
      const url = URL.createObjectURL(blob);
      preview.src = url;
      downloadLink.href = url;
      const sizeMB = (blob.size / 1024 / 1024).toFixed(1);
      setStatus(`Listo ✅ (${sizeMB} MB)`);
      resultBox.style.display = 'block';
      genBtn.disabled = false;
      barFill.style.width = '100%';
      audioCtx.close();
    };

    setStatus('Grabando vídeo...');
    recorder.start(250);
    await audioCtx.resume();
    audioEl.play();

    audioEl.addEventListener('timeupdate', () => {
      if (audioEl.duration) {
        const pct = (audioEl.currentTime / audioEl.duration) * 100;
        barFill.style.width = pct + '%';
      }
    });

    audioEl.addEventListener('ended', () => {
      setTimeout(() => recorder.stop(), 300);
    });

  } catch (err) {
    console.error(err);
    setStatus('Error: ' + err.message);
    genBtn.disabled = false;
  }
});
</script>

</body>
</html>
